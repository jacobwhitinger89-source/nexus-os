name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup target add x86_64-unknown-linux-musl
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --workspace -- --test-threads=1
      - name: Host supervisor integration test
        run: cargo build --locked --workspace && tests/host/supervisor-test.sh target/debug
      - name: Static release build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

  image:
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio rsync unzip file wget qemu-system-x86 qemu-utils ovmf python3
          rustup target add x86_64-unknown-linux-musl
          sudo chmod 666 /dev/kvm || true
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('buildroot/configs/*', 'Makefile', 'buildroot/patches/**') }}
          restore-keys: dl-
      - name: Build image
        run: make setup && make build
      - name: Image validation
        run: |
          cd build/output/images
          sha256sum -c SHA256SUMS
          ls -l
      - name: QEMU boot test
        run: make test-boot
      - name: QEMU install / end-to-end test
        run: make test-install
      - name: Benchmarks
        run: make bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-images
          path: |
            build/output/images/*.iso
            build/output/images/*-update.tar
            build/output/images/SHA256SUMS
            build/qemu/*-results.json
            build/qemu/*.log
            benchmarks/results/*.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexus-images
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --prerelease --repo "${GITHUB_REPOSITORY}" \
            --title "NEXUS OS ${GITHUB_REF_NAME}" --notes "See CHANGELOG.md" \
            build/output/images/*.iso build/output/images/*-update.tar build/output/images/SHA256SUMS

[workspace]
resolver = "3"
members = ["management/core", "management/cli", "projects/supervisor", "installer", "examples/hello-http"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nexus-os/nexus"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# NEXUS OS installer / live media boot menu
set timeout=5
set default=0
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

menuentry "Install NEXUS OS" {
	linux /boot/bzImage nexus.mode=live console=tty1 console=ttyS0,115200 loglevel=4
	initrd /boot/initrd.zst
}
menuentry "NEXUS OS recovery shell (no installer)" {
	linux /boot/bzImage nexus.mode=live nexus.shell=1 console=tty1 console=ttyS0,115200 loglevel=4
	initrd /boot/initrd.zst
}
menuentry "Reboot" {
	reboot
}

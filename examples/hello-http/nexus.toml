# NEXUS application manifest for the hello-http example.
# Deploy a prebuilt binary (no [build] section needed):
#   cargo build --release --target x86_64-unknown-linux-musl -p hello-http
#   mkdir -p dist && cp target/x86_64-unknown-linux-musl/release/hello-http examples/hello-http/nexus.toml dist/
#   tar -czf - -C dist . | ssh admin@pixel.local nexus deploy hello

[project]
description = "Minimal HTTP service demonstrating NEXUS integration"

[[service]]
name = "web"
command = "./hello-http"
ports = [8080]
restart = "on-failure"

[service.health]
http = "/health"
interval = 5
start_period = 10
